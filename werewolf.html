<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Werewolf</title>
<!-- Home-screen launcher for the Werewolf web app: full screen, app icon, edges painted to match -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Werewolf">
<meta name="theme-color" content="#101014">
<link rel="apple-touch-icon" href="werewolf-180.png">
<link rel="icon" type="image/png" href="werewolf-192.png">
<link rel="manifest" href="werewolf.webmanifest">
<style>
  html, body { margin:0; height:100%; background:#101014; overflow:hidden; overscroll-behavior:none; }
  /* In a browser tab the game simply fills the window. */
  #frame { position:fixed; inset:0; }
  /* From the home screen: Werewolf already leaves room for the Dynamic Island and
     home bar itself, so the launcher only adds the gap that clears the blur.
     iOS reports a home-screen page as one status bar shorter than the screen,
     so the real screen height is set from the script below. */
  :root { --gap-top:24px; }
  .home-screen, .home-screen body { height:var(--screen-h); }
  .home-screen #frame { position:absolute; inset:auto 0 auto 0; top:var(--gap-top);
                        height:calc(var(--screen-h) - var(--gap-top)); }
  #app { display:block; width:100%; height:100%; border:0; background:#101014; }
  #splash { position:fixed; inset:0; z-index:2; background:#101014; display:grid; place-items:center;
            transition:opacity .45s ease; }
  #splash.gone { opacity:0; pointer-events:none; }
  #splash div { display:grid; justify-items:center; gap:14px; }
  #splash img { width:96px; height:96px; border-radius:22px; }
  #splash b { font:800 22px system-ui, -apple-system, sans-serif; letter-spacing:.14em; color:#e3c48a; text-transform:uppercase; }
  #splash i { width:34px; height:3px; border-radius:2px; background:#e3c48a; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.25; transform:scaleX(.6); } 50% { opacity:1; transform:scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { #splash i { animation:none; } }
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div><img src="werewolf-180.png" alt=""><b>Werewolf</b><i></i></div></div>
<div id="frame"><iframe id="app" title="Werewolf" src="https://script.google.com/macros/s/AKfycbwr3feFax8KSciRMv8Mjlf2PHZSUQcDLz1jsfTPlhw7m_W9Z8eBZujw5Y3HisxrtLXh/exec" allow="autoplay; fullscreen; clipboard-read; clipboard-write; screen-wake-lock"></iframe></div>
<script>
  // Opened from the home screen (not a browser tab)
  if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) {
    var fit = function () {
      var h = Math.max(window.innerHeight, Math.max(screen.width, screen.height));
      if (window.innerWidth > window.innerHeight) h = window.innerHeight;   // turned sideways
      document.documentElement.style.setProperty('--screen-h', h + 'px');
    };
    fit();
    window.addEventListener('resize', fit);
    document.documentElement.classList.add('home-screen');
  }
  // Hide the splash once the app has loaded (with a little time for the game itself to draw)
  var splash = document.getElementById('splash');
  function hide() { splash.classList.add('gone'); }
  document.getElementById('app').addEventListener('load', function () { setTimeout(hide, 1500); });
  setTimeout(hide, 8000);   // never leave the splash up for good
</script>
</body>
</html>
